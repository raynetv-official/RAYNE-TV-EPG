
name: RAYNE TV EPG Merger

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge 8 EPG sources
        run: python merge_epg.py

      - name: Upload combined EPG to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: epg-latest
          name: RAYNE TV Combined EPG
          body: Automatically updated combined EPG.
          make_latest: true
          files: epg_combined.xml
          fail_on_unmatched_files: true
